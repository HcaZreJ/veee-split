# 国内网站清单（mihomo rule-provider，behavior: domain）。
# 两个分流模式共用这一份：
#   海外节点模式 → 这些域名直连
#   国内节点模式 → 这些域名走 Veee（拿国内 IP）
# 想添加网站：在 payload 末尾加一行  - '+.网站域名'  （+. 表示含所有子域名），
# 然后运行 veee-split reload 生效。所有 .cn 结尾的域名已被 '+.cn' 覆盖，无需单独添加。
